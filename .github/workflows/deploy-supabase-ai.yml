name: Deploy Supabase AI functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN as a repository Actions secret to deploy the AI functions."
            exit 1
          fi
          if [[ -z "$SUPABASE_URL" ]]; then
            echo "::error::VITE_SUPABASE_URL is missing; the AI functions cannot be linked to the app's Supabase project."
            exit 1
          fi
          host="${SUPABASE_URL#https://}"
          host="${host#http://}"
          project_ref="${host%%.*}"
          if [[ -z "$project_ref" || "$project_ref" == "$host" ]]; then
            echo "::error::VITE_SUPABASE_URL is not a valid Supabase project URL."
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure AI provider secrets
        shell: bash
        run: |
          secrets=()
          if [[ -n "$GEMINI_API_KEY" ]]; then
            secrets+=("GEMINI_API_KEY=$GEMINI_API_KEY")
          fi
          if [[ -n "$OPENAI_API_KEY" ]]; then
            secrets+=("OPENAI_API_KEY=$OPENAI_API_KEY")
          fi
          if ((${#secrets[@]})); then
            supabase secrets set "${secrets[@]}" --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "::warning::No AI provider key was supplied to this workflow; existing Supabase AI secrets will be left unchanged."
          fi

      - name: Deploy production AI functions
        shell: bash
        run: |
          for function in summarize-notes solve-assignment generate-flashcards generate-questions grade-answer; do
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF"
          done
